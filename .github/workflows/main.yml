name: Build si jimpit APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Generate Android folder if missing
        run: |
          flutter create . --platforms=android --project-name si_jimpit
          flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-name="si jimpit"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: si-jimpit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
